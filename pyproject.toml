[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "erc8415-kit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "pymysql>=1.1,<2", "cryptography>=44"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["api*", "engine*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=api --cov=engine --cov=adapters --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
